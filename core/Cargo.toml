[package]
name = "tudoku-core"
version = "0.2.0"
edition = "2024"

[dependencies]
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = { version = "7.0.0", optional = true }

[features]
default = ["desktop-dirs"]
desktop-dirs = ["dep:dirs"]
test-support = []

[dev-dependencies]
tempfile = "3.27.0"
