[package]
name = "tudoku"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
signal-hook = "0.4.5"
