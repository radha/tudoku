[package]
name = "tudoku"
version = "0.2.0"
edition = "2024"

[workspace]
members = ["core"]

[dependencies]
tudoku-core = { path = "core" }
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
rand = "0.10.3"

[dev-dependencies]
tudoku-core = { path = "core", features = ["test-support"] }
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
signal-hook = "0.4.5"
